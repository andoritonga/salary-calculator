services:
  salary-calculator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salary-calculator-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - NODE_ENV=production
